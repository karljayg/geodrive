# GeoDrive's world server: /geodrive/ws -> 127.0.0.1:5175. Installed as /etc/httpd/conf.d/geodrive-proxy.conf by scripts/install-server.sh,
# beside the Agecraft files, which it doesn't touch. Everything else under /geodrive/ stays plain files. Needs mod_proxy and mod_proxy_wstunnel, already on.
<IfModule mod_proxy.c>
  ProxyPass /geodrive/ws ws://127.0.0.1:5175/
</IfModule>
